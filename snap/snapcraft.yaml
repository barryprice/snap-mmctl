name: mmctl-bp
title: mmctl
summary: mmctl is a remote CLI tool for Mattermost
description: |
  mmctl is a remote CLI tool that lets you manage your Mattermost instance from the terminal.
license: MIT

contact:
  - https://github.com/barryprice
issues:
  - https://github.com/barryprice/snap-mmctl/issues
source-code:
  - https://github.com/mattermost/mattermost/tree/master/server/cmd/mmctl
website:
  - https://github.com/mattermost/mattermost

adopt-info: mmctl
confinement: strict
grade: stable
base: core26

platforms:
  # at time of writing, mmctl fails to compile on both armhf and s390x due to type errors
  amd64:
    build-on:
      - amd64
  arm64:
    build-on:
      - arm64
  ppc64el:
    build-on:
      - ppc64el
  riscv64:
    build-on:
      - riscv64

apps:
  mmctl:
    command: bin/mmctl
    plugs: [home, network]
    environment:
      XDG_CONFIG_HOME: "$SNAP_USER_COMMON/.config/"

parts:
  mmctl:
    plugin: make
    source-type: git
    source: https://github.com/mattermost/mattermost.git
    source-depth: 1
    build-snaps:
      - go/latest/stable
    override-pull: |
      craftctl default
      # Pinned upstream release tag. Renovate bumps this line automatically
      # when mattermost/mattermost publishes a new release (see renovate.json).
      # renovate: datasource=github-releases depName=mattermost/mattermost
      mmctl_version="v11.10.1"
      # Ensure the pinned tag exists locally (shallow clones may omit it),
      # then build exactly that release.
      git fetch --tags --force origin
      git checkout --detach "${mmctl_version}"
      craftctl set version="${mmctl_version#v}"
    override-build: |
      make -C server mmctl-build
      mkdir ${SNAPCRAFT_PART_INSTALL?}/bin
      cp -v server/bin/mmctl ${SNAPCRAFT_PART_INSTALL?}/bin/
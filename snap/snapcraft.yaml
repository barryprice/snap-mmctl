name: mmctl-bp
title: mmctl
contact:
  - https://github.com/barryprice
issues:
  - https://github.com/barryprice/snap-mmctl/issues
source-code:
  - https://github.com/mattermost/mattermost/tree/master/server/cmd/mmctl
website:
  - https://github.com/mattermost/mattermost
license: MIT
base: core26
adopt-info: mmctl
summary: mmctl is a remote CLI tool for Mattermost
description: |
  mmctl is a remote CLI tool that lets you manage your Mattermost instance from the terminal.
grade: stable
confinement: strict

apps:
  mmctl:
    command: bin/mmctl
    plugs: [home, network]
    environment:
      XDG_CONFIG_HOME: "$SNAP_USER_COMMON/.config/"

parts:
  mmctl:
    plugin: make
    source-type: git
    source: https://github.com/mattermost/mattermost.git
    source-depth: 1
    build-snaps:
      - go/latest/stable
    override-pull: |
      craftctl default
      # list tags remotely (no commit download), then fetch only the one we need
      latest_tag=$(git ls-remote --tags --sort=version:refname origin \
        | grep 'refs/tags/v' | grep -v '\^{}' | grep -v '\-rc' \
        | sed 's|.*refs/tags/||' | tail -1)
      git fetch --depth=1 origin "refs/tags/${latest_tag?}:refs/tags/${latest_tag}"
      git checkout ${latest_tag}
      craftctl set version=${latest_tag}
    override-build: |
      make -C server mmctl-build
      mkdir ${SNAPCRAFT_PART_INSTALL?}/bin
      cp -v server/bin/mmctl ${SNAPCRAFT_PART_INSTALL?}/bin/
